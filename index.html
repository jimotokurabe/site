<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>じもとくらべ（準備中）</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f5f0; --fg: #1f2328; --muted: #5b6168; --accent: #1d5ba6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181b; --fg: #e8e6e1; --muted: #a4a9ae; --accent: #7fb0ec; }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg); line-height: 1.8;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Yu Gothic", Meiryo, sans-serif;
  }
  main { padding: 32px 16px; max-width: 32rem; text-align: center; }
  h1 { margin: 0 0 .5rem; font-size: 2rem; letter-spacing: .08em; color: var(--accent); }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>じもとくらべ</h1>
  <p>市や町ごとにちがう制度を、並べて比べられるサイトです。<br>ただいま準備中です。</p>
</main>
</body>
</html>
